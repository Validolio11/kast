appId: com.kast.app
productName: Kast
copyright: Copyright © 2026 Ivan
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  # .ico з BMP для малих розмірів: з .png панель задач Windows 11 показує порожній аркуш (scripts/make-ico.cjs)
  icon: build/icon.ico
  executableName: Kast
nsis:
  # Встановлення в один клік, без прав адміністратора і зайвих екранів
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Kast
  artifactName: Kast-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: Validolio11
  repo: kast
  releaseType: release
